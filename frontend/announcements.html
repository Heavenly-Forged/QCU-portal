<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCU Portal - University Bulletins & Announcements</title>
  <link rel="icon" type="image/png" href="assets/images/qcu_logo.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages/announcements.css">
</head>
<body>

  <div class="sidebar-overlay"></div>

  <!-- Shared Sidebar -->
  <aside class="sidebar">
    <div class="brand-section">
      <img src="assets/images/qcu_logo.png" alt="QCU Logo" class="brand-logo-img">
      <div>
        <h3 style="font-size: 0.95rem; color: #FFFFFF;">QCU Portal</h3>
        <small style="color: var(--qcu-accent);">San Bartolome</small>
      </div>
    </div>
    
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="announcements.html" class="nav-link active">Announcements</a></li>
      <li><a href="assessment.html" class="nav-link">Assessment Slip</a></li>
      <li><a href="grades.html" class="nav-link">Grades & GWA</a></li>
      <li><a href="schedule.html" class="nav-link">Class Schedule</a></li>
      <li><a href="organizations.html" class="nav-link">Organizations</a></li>
    </ul>

    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">
        <span>🚪</span> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Viewport -->
  <div class="app-container">
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle-btn" aria-label="Toggle navigation">☰</button>
        <h2 style="font-size: 1.1rem;">University Bulletins</h2>
      </div>
      <div class="user-badge">Student: <strong>Juan Dela Cruz</strong></div>
    </header>

    <main class="content-body">
      <!-- Search & Category Filters -->
      <section class="announcements-controls">
        <div class="search-box">
          <input type="text" id="bulletinSearch" class="search-input" placeholder="Search notices, memos, or updates...">
        </div>
        <div class="filter-tabs">
          <button class="tab-btn active" data-category="ALL">All Updates</button>
          <button class="tab-btn" data-category="ACADEMIC">Academic</button>
          <button class="tab-btn" data-category="ADMINISTRATIVE">Administrative</button>
          <button class="tab-btn" data-category="EVENTS">Events</button>
        </div>
      </section>

      <!-- Feed Container -->
      <section class="announcements-feed" id="bulletinFeed">
        <!-- Injected via JavaScript -->
      </section>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="logout-modal-backdrop" id="logoutModal">
    <div class="logout-modal-box">
      <h3>Sign Out</h3>
      <p>Are you sure you want to sign out of your QCU Student Portal account?</p>
      <div class="logout-modal-actions">
        <button type="button" class="logout-btn-cancel" id="cancelLogoutBtn">Cancel</button>
        <button type="button" class="logout-btn-confirm" id="confirmLogoutBtn">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/modules/announcements.js"></script>
</body>
</html>
