<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCU Portal - Student Organizations</title>
  <link rel="icon" type="image/png" href="assets/images/qcu_logo.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages/orgs.css">
</head>
<body>

  <div class="sidebar-overlay"></div>

  <aside class="sidebar">
    <div class="brand-section">
      <img src="assets/images/qcu_logo.png" alt="QCU Logo" class="brand-logo-img">
      <div>
        <h3 class="brand-text-title">QCU Portal</h3>
<small class="brand-text-sub">San Bartolome</small>
      </div>
    </div>
    
    <ul class="nav-list">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="profile.html" class="nav-link">Student Profile</a></li>
      <li><a href="announcements.html" class="nav-link">Announcements</a></li>
      <li><a href="assessment.html" class="nav-link">Assessment Slip</a></li>
      <li><a href="grades.html" class="nav-link">Grades & GWA</a></li>
      <li><a href="schedule.html" class="nav-link">Class Schedule</a></li>
      <li><a href="organizations.html" class="nav-link active">Organizations</a></li>
    </ul>

    <button class="btn-logout" id="logoutBtn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <polyline points="16 17 21 12 16 7"></polyline>
    <line x1="21" y1="12" x2="9" y2="12"></line>
  </svg>
  Sign Out
</button>
  </aside>

  <div class="app-container">
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle-btn" aria-label="Toggle menu">☰</button>
        <h2 class="header-page-title">SASD Directory</h2>
      </div>
      <div class="user-badge">Student: <strong>Juan Dela Cruz</strong></div>
    </header>

    <main class="content-body">
      <section class="orgs-controls">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="Search organization by name or tag...">
        </div>
        <div class="filter-tabs">
          <button class="tab-btn active" data-category="ALL">All Orgs</button>
          <button class="tab-btn" data-category="ACADEMIC">Academic</button>
          <button class="tab-btn" data-category="NON_ACADEMIC">Non-Academic</button>
        </div>
      </section>

      <section class="orgs-grid" id="orgsContainer"></section>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="logout-modal-backdrop" id="logoutModal">
    <div class="logout-modal-box">
      <h3>Sign Out</h3>
      <p>Are you sure you want to sign out of your QCU Student Portal account?</p>
      <div class="logout-modal-actions">
        <button type="button" class="logout-btn-cancel" id="cancelLogoutBtn">Cancel</button>
        <button type="button" class="logout-btn-confirm" id="confirmLogoutBtn">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="js/navigation.js"></script>
  <script src="js/modules/orgs.js"></script>
</body>
</html>
